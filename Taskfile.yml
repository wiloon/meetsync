version: "3"

tasks:
  api:dev:
    desc: Run the Go API locally (:8080)
    dir: api
    cmds:
      - go run .

  api:test:
    desc: Run the Go API's test suite
    dir: api
    cmds:
      - go test ./...

  web:dev:
    desc: Run the Next.js dev server locally (:3000). Requires Node 18.18+/20+ — see web/.node-version.
    dir: web
    cmds:
      - npm run dev
